name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID containing the Windows and Linux artifacts"
        required: true
        default: "41295285570"
      tag:
        description: "Release tag to create"
        required: true
        default: "mykrkr2-2026-11-01"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/windows release/linux
          gh run download "${{ inputs.run_id }}" \
            -R "${{ github.repository }}" \
            -n windows-binaries \
            -D release/windows
          gh run download "${{ inputs.run_id }}" \
            -R "${{ github.repository }}" \
            -n linux-binaries \
            -D release/linux

      - name: Package release archives
        run: |
          cd release/windows
          zip -r "$GITHUB_WORKSPACE/mykrkr2-windows-x64.zip" .
          cd ../linux
          zip -r "$GITHUB_WORKSPACE/mykrkr2-linux-x64.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          cat > NOTES.md <<EOF
          Windows x64 and Linux x64 builds of the KrKr2 emulator.

          Built by GitHub Actions from commit ${{ github.sha }}.
          CI run: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}

          Windows: extract the archive and run krkr2/krkr2.exe
          Linux: extract the archive, run chmod +x krkr2, then ./krkr2
          EOF

          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/mykrkr2-windows-x64.zip" \
            "$GITHUB_WORKSPACE/mykrkr2-linux-x64.zip" \
            -R "${{ github.repository }}" \
            --title "mykrkr2 build $TAG" \
            --notes-file NOTES.md
