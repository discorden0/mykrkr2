name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID containing the android-apks artifact"
        required: true
      tag:
        description: "Existing release tag to attach the APK to"
        required: true
        default: "mykrkr2-2026-11-01"

permissions:
  contents: write
  actions: read

jobs:
  publish-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh run download "${{ inputs.run_id }}" \
            -R "${{ github.repository }}" \
            -n android-apks \
            -D apks
          find apks -type f -name "*.apk" -print

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(find apks -type f -name "*.apk")
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK files found in android-apks artifact"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" \
            -R "${{ github.repository }}" \
            --clobber
